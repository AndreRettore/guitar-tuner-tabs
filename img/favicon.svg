<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Recorte no formato exato da palheta para prender a sombra interior -->
    <clipPath id="pickClip">
      <path d="M 256 60 C 375 60, 425 125, 415 230 C 402 340, 318 425, 256 460 C 194 425, 110 340, 97 230 C 87 125, 137 60, 256 60 Z"/>
    </clipPath>
  </defs>

  <!-- Base da Palheta -->
  <path d="M 256 60 C 375 60, 425 125, 415 230 C 402 340, 318 425, 256 460 C 194 425, 110 340, 97 230 C 87 125, 137 60, 256 60 Z" fill="#8E5A2B"/>

  <!-- Sombra Projetada (Flat Long Shadow) -->
  <g clip-path="url(#pickClip)">
    <path d="M 256 145 L 316 132 L 322 172 L 329 198 L 322 241 L 296 285 L 296 500 L 650 500 L 650 145 Z" fill="#000000" opacity="0.22"/>
  </g>

  <!-- Headstock e Braço da Guitarra -->
  <path d="M 256 145 C 238 135, 212 128, 196 132 C 190 172, 202 225, 216 285 L 216 465 L 296 465 L 296 285 C 310 225, 322 172, 316 132 C 300 128, 274 135, 256 145 Z" fill="#F3E1C3"/>

  <!-- Nut (Pestana) -->
  <rect x="214" y="282" width="84" height="8" rx="2" fill="#1E1B18"/>

  <!-- Trastes e Marcações do Braço -->
  <g stroke="#1E1B18" stroke-width="2.5">
    <line x1="216" y1="320" x2="296" y2="320"/>
    <line x1="216" y1="355" x2="296" y2="355"/>
    <line x1="216" y1="390" x2="296" y2="390"/>
    <line x1="216" y1="425" x2="296" y2="425"/>
    <line x1="216" y1="460" x2="296" y2="460"/>
  </g>

  <!-- Marcadores de Escala (Inlays) -->
  <circle cx="256" cy="337.5" r="3.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="256" cy="407.5" r="3.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- Tarraxas - Lado Esquerdo -->
  <g fill="#1E1B18" stroke="#1E1B18">
    <!-- Pinos / Hastes -->
    <line x1="185" y1="155" x2="202" y2="155" stroke-width="4.5"/>
    <line x1="190" y1="198" x2="207" y2="198" stroke-width="4.5"/>
    <line x1="197" y1="241" x2="212" y2="241" stroke-width="4.5"/>

    <!-- Borboletas das Tarraxas -->
    <ellipse cx="178" cy="155" rx="8" ry="12"/>
    <ellipse cx="183" cy="198" rx="8" ry="12"/>
    <ellipse cx="190" cy="241" rx="8" ry="12"/>

    <!-- Postes de Fixação no Headstock -->
    <circle cx="222" cy="155" r="3.5"/>
    <circle cx="228" cy="198" r="3.5"/>
    <circle cx="234" cy="241" r="3.5"/>
  </g>

  <!-- Tarraxas - Lado Direito -->
  <g fill="#1E1B18" stroke="#1E1B18">
    <!-- Pinos / Hastes -->
    <line x1="327" y1="155" x2="310" y2="155" stroke-width="4.5"/>
    <line x1="322" y1="198" x2="305" y2="198" stroke-width="4.5"/>
    <line x1="315" y1="241" x2="300" y2="241" stroke-width="4.5"/>

    <!-- Borboletas das Tarraxas -->
    <ellipse cx="334" cy="155" rx="8" ry="12"/>
    <ellipse cx="329" cy="198" rx="8" ry="12"/>
    <ellipse cx="322" cy="241" rx="8" ry="12"/>

    <!-- Postes de Fixação no Headstock -->
    <circle cx="290" cy="155" r="3.5"/>
    <circle cx="284" cy="198" r="3.5"/>
    <circle cx="278" cy="241" r="3.5"/>
  </g>

  <!-- Cordas (do poste até a pestana e descendo pelo braço) -->
  <g fill="none" stroke="#1E1B18" stroke-linecap="round">
    <!-- 6ª Corda (E Grave - mais espessa) -->
    <path d="M 234 241 L 223 282 L 223 465" stroke-width="2.6"/>
    <!-- 5ª Corda (A) -->
    <path d="M 228 198 L 236 282 L 236 465" stroke-width="2.2"/>
    <!-- 4ª Corda (D) -->
    <path d="M 222 155 L 249 282 L 249 465" stroke-width="1.9"/>
    <!-- 3ª Corda (G) -->
    <path d="M 290 155 L 263 282 L 263 465" stroke-width="1.6"/>
    <!-- 2ª Corda (B) -->
    <path d="M 284 198 L 276 282 L 276 465" stroke-width="1.3"/>
    <!-- 1ª Corda (E Aguda - mais fina) -->
    <path d="M 278 241 L 289 282 L 289 465" stroke-width="1.0"/>
  </g>
</svg>