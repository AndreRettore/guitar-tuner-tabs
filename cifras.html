<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="description" content="Cifras para violão com transposição de tom e diagramas de acordes.">
<title>Cifras</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta property="og:type" content="website">
<meta property="og:title" content="Cifras">
<meta property="og:description" content="Cifras para violão com transposição de tom e diagramas de acordes.">
<meta property="og:url" content="https://andrerettore.github.io/guitar-tuner-tabs/cifras.html">
<meta property="og:image" content="https://andrerettore.github.io/guitar-tuner-tabs/img/og-image.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<style>
  :root {
    --bg: #0e0f11;
    --panel: #15171a;
    --fg: #e8e8e6;
    --dim: #6b6d72;
    --faint: #25272b;
    --chord: #f5a524;
    --fs: 17px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  :focus-visible { outline: 2px solid var(--chord); outline-offset: 2px; }

  /* ---------- Navegação (igual à do afinador) ---------- */
  header {
    display: flex;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px 12px;
    font-size: clamp(.7rem, 1.8dvh, .9rem);
    letter-spacing: .25em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--faint);
  }
  .nav { display: flex; gap: 1.6em; }
  .nav a { color: var(--dim); text-decoration: none; padding-bottom: 3px; border-bottom: 1px solid transparent; }
  .nav a[aria-current] { color: var(--fg); border-bottom-color: var(--fg); }

  /* ---------- Layout ---------- */
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px 1fr; }
  .list { border-right: 1px solid var(--faint); display: flex; flex-direction: column; min-height: 0; }
  .song { overflow-y: auto; min-height: 0; overscroll-behavior: contain; }

  /* ---------- Lista ---------- */
  .search { padding: 16px; }
  .search input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--faint);
    border-radius: 8px;
    padding: 10px 12px;
    outline: none;
  }
  .search input:focus { border-color: var(--dim); }
  .search input::placeholder { color: var(--dim); }
  .count { display: flex; justify-content: space-between; padding: 0 16px 8px; font-size: .75rem; color: var(--dim); letter-spacing: .05em; }
  .count a { color: var(--chord); text-decoration: none; }
  .count a:hover { text-decoration: underline; }
  .count .links { display: flex; gap: 14px; }
  .count button { color: var(--chord); font-size: inherit; letter-spacing: inherit; }
  .count button:hover { text-decoration: underline; }

  /* ---------- Desbloquear cifras privadas ---------- */
  .unlock { display: flex; flex-direction: column; gap: 8px; padding: 4px 16px 12px; }
  .unlock[hidden] { display: none; }
  .unlock input[type="password"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--faint);
    border-radius: 8px;
    padding: 10px 12px;
    outline: none;
  }
  .unlock input[type="password"]:focus { border-color: var(--dim); }
  .remember { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--dim); }
  .remember input { accent-color: var(--chord); }
  .unlock-row { display: flex; align-items: center; gap: 10px; font-size: .8rem; color: var(--dim); }
  .unlock-row button { height: 32px; padding: 0 14px; border-radius: 6px; background: var(--panel); border: 1px solid var(--faint); }
  .unlock-row button:hover { border-color: var(--dim); }
  .unlock-row button:disabled { opacity: .5; cursor: default; }
  .locked { display: flex; flex-direction: column; gap: 10px; max-width: 360px; padding: 16px 24px; }
  .locked p { color: var(--dim); }
  .locked input[type="password"] {
    background: var(--panel);
    border: 1px solid var(--faint);
    border-radius: 8px;
    padding: 10px 12px;
    outline: none;
  }
  .locked input[type="password"]:focus { border-color: var(--dim); }
  .notice { padding: 0 16px 10px; font-size: .8rem; color: var(--dim); line-height: 1.5; }
  .notice button { color: var(--chord); text-decoration: underline; font-size: inherit; }

  /* ---------- Importar ---------- */
  .artist a { color: var(--chord); }
  .artist code { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--fg); font-size: .9em; }
  .imp { display: flex; flex-direction: column; gap: 14px; padding: 12px 24px 0; }
  .fields { display: grid; grid-template-columns: 2fr 2fr 1fr; gap: 12px; }
  .fields .wide { grid-column: 1 / -1; }
  .fields label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--dim); }
  .imp input, .imp textarea {
    background: var(--panel);
    border: 1px solid var(--faint);
    border-radius: 8px;
    padding: 10px 12px;
    outline: none;
    min-width: 0;
  }
  .imp input:focus, .imp textarea:focus { border-color: var(--dim); }
  .imp textarea {
    min-height: 220px;
    resize: vertical;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .85rem;
    white-space: pre;
  }
  .imp-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .85rem; color: var(--dim); margin-bottom: 6px; }
  .imp-btns { display: flex; gap: 8px; }
  .imp-enc { display: flex; flex-direction: column; gap: 8px; }
  .imp-enc-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .imp-enc-row input { flex: 1; min-width: 180px; }
  .imp-enc-row span { flex: 1; font-size: .85rem; color: var(--dim); }
  .imp-enc-row button {
    height: 40px;
    padding: 0 16px;
    border-radius: 8px;
    background: var(--chord);
    color: var(--bg);
    font-weight: 600;
  }
  .imp-enc-row button:disabled { opacity: .5; cursor: default; }
  .imp-msg { font-size: .85rem; color: var(--dim); }
  .imp-msg a { color: var(--chord); }
  .imp-bar button { height: 32px; padding: 0 14px; border-radius: 6px; background: var(--panel); border: 1px solid var(--faint); }
  .imp-bar button:hover { border-color: var(--dim); }
  #iCodigo {
    max-height: 200px;
    overflow: auto;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--faint);
    border-radius: 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .8rem;
    color: var(--dim);
  }
  .imp-h { font-size: .8rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-top: 8px; }
  .imp-enc-row button + button { background: var(--panel); color: var(--fg); border: 1px solid var(--faint); }

  /* ---------- Importar em lote ---------- */
  .passos { display: flex; flex-direction: column; gap: 6px; padding-left: 1.2em; color: var(--dim); line-height: 1.5; font-size: .9rem; }
  .passos b { color: var(--fg); font-weight: 600; }
  .fav { padding: 2px 10px; border: 1px dashed var(--chord); border-radius: 6px; color: var(--chord); text-decoration: none; cursor: grab; white-space: nowrap; }
  .fila { padding: 8px 24px 40vh; }
  .fila ul { list-style: none; }
  .fila-h { padding: 8px 0; font-size: .8rem; color: var(--dim); letter-spacing: .05em; }
  .fila li { display: flex; align-items: baseline; gap: 12px; padding: 8px 0 8px 10px; border-bottom: 1px solid var(--faint); border-left: 2px solid transparent; }
  .fila li.atual { border-left-color: var(--chord); }
  .fila li button { flex: 1; text-align: left; }
  .fila li button:disabled { cursor: default; }
  .fila li button span { color: var(--dim); font-size: .85rem; margin-left: 8px; }
  .fila li em { font-style: normal; font-size: .8rem; color: var(--dim); white-space: nowrap; }
  .fila li a { color: var(--chord); font-size: .8rem; }
  #songs { list-style: none; overflow-y: auto; flex: 1; padding-bottom: 16px; }
  #songs a {
    display: block;
    padding: 12px 16px;
    text-decoration: none;
    color: var(--fg);
    border-left: 2px solid transparent;
  }
  #songs a:hover { background: var(--panel); }
  #songs a[aria-current] { border-left-color: var(--chord); background: var(--panel); }
  #songs b { display: block; font-weight: 500; }
  #songs span { font-size: .85rem; color: var(--dim); }
  .none { padding: 12px 16px; color: var(--dim); font-size: .9rem; }

  /* ---------- Música ---------- */
  .empty { height: 100%; display: grid; place-items: center; color: var(--dim); }
  .song-head { padding: 24px 24px 8px; }
  .back { display: none; color: var(--dim); font-size: .9rem; margin-bottom: 12px; }
  h1 { font-size: 1.6rem; font-weight: 600; line-height: 1.2; }
  .artist { color: var(--dim); margin-top: 2px; }
  .source { color: var(--dim); font-size: .8rem; margin-top: 6px; }
  .source a { color: var(--dim); text-decoration: underline; text-underline-offset: 2px; }
  .source a:hover { color: var(--fg); }

  .tools {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    padding: 12px 24px;
    background: var(--bg);
    border-bottom: 1px solid var(--faint);
    font-size: .85rem;
  }
  .tool { display: flex; align-items: center; gap: 4px; }
  .tool > span { color: var(--dim); margin-right: 4px; }
  .tool b { min-width: 2.6em; text-align: center; font-weight: 600; }
  .tool .key { color: var(--chord); }
  .tools button {
    min-width: 32px;
    height: 32px;
    padding: 0 10px;
    border-radius: 6px;
    background: var(--panel);
    border: 1px solid var(--faint);
  }
  .tools button:hover { border-color: var(--dim); }
  .tools button[aria-pressed="true"] { border-color: var(--chord); color: var(--chord); }

  .diagrams { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 16px 24px 0; }
  .diagrams[hidden] { display: none; }
  .diagrams figure { text-align: center; }
  .diagrams figcaption { color: var(--chord); font-weight: 600; font-size: .9rem; }
  .diagrams svg { width: 64px; height: auto; display: block; }
  .diagrams .ln { stroke: var(--dim); }
  .diagrams .nut { stroke: var(--fg); }
  .diagrams .dot { fill: var(--fg); }
  .diagrams .mk { fill: none; stroke: var(--dim); }
  .diagrams .fr { fill: var(--dim); font-size: 8px; }

  .sheet { padding: 16px 24px 40vh; font-size: var(--fs); line-height: 1.35; }
  .sheet h3 {
    font-size: .8em;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 1.2em 0 .4em;
  }
  .sheet h3:first-child { margin-top: 0; }
  .c { color: var(--chord); font-weight: 600; font-style: normal; }
  .cl { display: flex; flex-wrap: wrap; gap: .3em 1.1em; margin: .15em 0; }
  .cl span { color: var(--dim); }
  .ly { white-space: pre-wrap; }
  .gap { height: .8em; }
  .row { display: flex; flex-wrap: wrap; align-items: flex-end; margin: .15em 0; }
  .seg { display: inline-flex; flex-direction: column; white-space: pre; }
  .seg i { min-height: 1.35em; padding-right: .5em; }
  .tab {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .85em;
    color: var(--dim);
    white-space: pre;
    overflow-x: auto;
  }

  /* ---------- Celular: lista OU música ---------- */
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .list { border-right: 0; }
    .app .song { display: none; }
    .app.viewing .list { display: none; }
    .app.viewing .song { display: block; }
    .back { display: inline-block; }
    .song-head { padding: 16px 16px 8px; }
    .tools { padding: 10px 16px; }
    .diagrams { padding: 16px 16px 0; }
    .sheet { padding: 16px 16px 40vh; }
    .imp { padding: 12px 16px 0; }
    .fila { padding: 8px 16px 40vh; }
    .locked { padding: 16px; }
    .fields { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
  <header>
    <nav class="nav">
      <a href="index.html">Afinador</a>
      <a href="cifras.html" aria-current="page">Cifras</a>
    </nav>
  </header>

  <div class="app" id="app">
    <aside class="list">
      <div class="search"><input id="q" type="search" placeholder="Buscar música ou artista" autocomplete="off"></div>
      <div class="count"><span id="count"></span>
        <span class="links"><button id="lockBtn" type="button" hidden></button><a href="#importar">+ Importar</a></span></div>
      <form class="unlock" id="unlock" hidden>
        <input id="pw" type="password" placeholder="Senha das cifras privadas" autocomplete="current-password">
        <label class="remember"><input type="checkbox" id="remember" checked> Lembrar neste aparelho</label>
        <div class="unlock-row"><button type="submit" id="pwBtn">Abrir</button><span id="pwMsg" role="status"></span></div>
      </form>
      <p class="notice" id="idxNotice" hidden>Os nomes das músicas protegidas ainda não aparecem com a página bloqueada.
        <button type="button" id="idxBtn">Atualizar índice</button> <span id="idxMsg" role="status"></span></p>
      <ul id="songs"></ul>
    </aside>
    <section class="song" id="song"></section>
  </div>

<script src="musicas.js"></script>
<!-- Índice das cifras privadas criptografadas (gerado por criptografar.js); pode não existir -->
<script src="musicas/criptografadas/indice.js" onerror="this.remove()"></script>
<script>
(() => {
  const byTitle = (a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR');
  const PUBLICAS = (window.MUSICAS || []).slice().sort(byTitle);
  let MUSICAS = PUBLICAS;
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  // Preferências salvas só neste navegador
  const store = {
    get(k, d) { try { const v = localStorage.getItem('cifras.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('cifras.' + k, JSON.stringify(v)); } catch {} },
  };

  // ---------- Acordes ----------
  const SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const FLAT = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  const NOTE = n => { const i = SHARP.indexOf(n); return i >= 0 ? i : FLAT.indexOf(n); };
  // O sufixo aceita "/9" como em D6/9 e E7/9; a barra seguida de nota é o baixo (D/F#)
  const CHORD_RE = /^([A-G][#b]?)((?:m|maj|min|dim|aug|sus|add|M|\/[0-9]+|[0-9]|[#b+°ºø()\-])*)(?:\/([A-G][#b]?))?$/;
  const isChord = t => CHORD_RE.test(t);

  function transpose(name, shift, flats) {
    const m = name.match(CHORD_RE);
    if (!m || !shift) return name;
    const names = flats ? FLAT : SHARP;
    const mv = n => names[(NOTE(n) + shift + 120) % 12];
    return mv(m[1]) + m[2] + (m[3] ? '/' + mv(m[3]) : '');
  }
  // Tons com bemol soam mais naturais escritos com bemol (Bb em vez de A#)
  const useFlats = key => [1, 3, 5, 8, 10].includes(NOTE(key.match(CHORD_RE)?.[1] || 'C'));

  // Formas (casas da 6ª para a 1ª corda; -1 = não tocar)
  const SHAPES = {
    'C': [-1,3,2,0,1,0], 'C7': [-1,3,2,3,1,0], 'Cmaj7': [-1,3,2,0,0,0], 'Cadd9': [-1,3,2,0,3,0],
    'C/G': [3,3,2,0,1,0], 'C/E': [0,3,2,0,1,0],
    'D': [-1,-1,0,2,3,2], 'Dm': [-1,-1,0,2,3,1], 'D7': [-1,-1,0,2,1,2], 'Dm7': [-1,-1,0,2,1,1],
    'Dmaj7': [-1,-1,0,2,2,2], 'Dsus4': [-1,-1,0,2,3,3], 'Dsus2': [-1,-1,0,2,3,0], 'D/F#': [2,-1,0,2,3,2],
    'E': [0,2,2,1,0,0], 'Em': [0,2,2,0,0,0], 'E7': [0,2,0,1,0,0], 'Em7': [0,2,2,0,3,3], 'Esus4': [0,2,2,2,0,0],
    'F': [1,3,3,2,1,1], 'Fmaj7': [-1,-1,3,2,1,0],
    'G': [3,2,0,0,3,3], 'G7': [3,2,0,0,0,1], 'G/B': [-1,2,0,0,3,3],
    'A': [-1,0,2,2,2,0], 'Am': [-1,0,2,2,1,0], 'A7': [-1,0,2,0,2,0], 'Am7': [-1,0,2,0,1,0],
    'Amaj7': [-1,0,2,1,2,0], 'Asus4': [-1,0,2,2,3,0], 'Asus2': [-1,0,2,2,0,0], 'A7sus4': [-1,0,2,0,3,0],
    'Am/E': [0,0,2,2,1,0],
    'B7': [-1,2,1,2,0,2], 'Bm': [-1,2,4,4,3,2], 'Bm7': [-1,2,0,2,0,2],
  };
  // Pestanas móveis (formato de E com tônica na 6ª corda, formato de A na 5ª)
  const E_SHAPE = { '': [0,2,2,1,0,0], m: [0,2,2,0,0,0], 7: [0,2,0,1,0,0], m7: [0,2,0,0,0,0], maj7: [0,2,1,1,0,0], sus4: [0,2,2,2,0,0] };
  const A_SHAPE = { '': [-1,0,2,2,2,0], m: [-1,0,2,2,1,0], 7: [-1,0,2,0,2,0], m7: [-1,0,2,0,1,0], maj7: [-1,0,2,1,2,0], sus4: [-1,0,2,2,3,0], '7sus4': [-1,0,2,0,3,0] };
  // Grafias comuns em sites de cifras → nomes da tabela de formas
  const SUFFIX = { '7M': 'maj7', 'M7': 'maj7', sus: 'sus4', min: 'm', 4: 'sus4', '(4)': 'sus4', '7(4)': '7sus4', '(9)': 'add9', 'add9': 'add9' };

  function shapeFor(name) {
    const m = name.match(CHORD_RE);
    if (!m) return null;
    const root = SHARP[NOTE(m[1])], suf = SUFFIX[m[2]] ?? m[2];
    const bass = m[3] ? '/' + SHARP[NOTE(m[3])] : '';
    if (SHAPES[root + suf + bass]) return SHAPES[root + suf + bass];
    if (bass) return null; // sem forma conhecida para esse baixo: melhor não mostrar nada que mostrar errado
    if (SHAPES[root + suf]) return SHAPES[root + suf];
    const r = NOTE(root), cands = [];
    if (E_SHAPE[suf]) cands.push([(r - 4 + 12) % 12, E_SHAPE[suf]]);
    if (A_SHAPE[suf]) cands.push([(r - 9 + 12) % 12, A_SHAPE[suf]]);
    if (!cands.length) return null;
    const [fret, offs] = cands.sort((a, b) => a[0] - b[0])[0];
    return offs.map(o => (o < 0 ? -1 : o + fret));
  }

  function diagram(name) {
    const frets = shapeFor(name);
    if (!frets) return '';
    const played = frets.filter(f => f > 0);
    const hi = Math.max(0, ...played), lo = Math.min(...played);
    const base = hi > 4 ? lo : 1;
    const X = i => 10 + i * 9, Y = k => 18 + k * 12;
    let s = '';
    for (let i = 0; i < 6; i++) s += `<line class="ln" x1="${X(i)}" y1="${Y(0)}" x2="${X(i)}" y2="${Y(5)}"/>`;
    for (let k = 0; k <= 5; k++) s += `<line class="ln${k === 0 && base === 1 ? ' nut' : ''}" x1="${X(0)}" y1="${Y(k)}" x2="${X(5)}" y2="${Y(k)}" stroke-width="${k === 0 && base === 1 ? 3 : 1}"/>`;
    if (base > 1) s += `<text class="fr" x="${X(5) + 4}" y="${Y(1) - 3}">${base}</text>`;
    // Pestana: começa na corda mais grave tocada e vai até a última corda na mesma casa,
    // sem cordas soltas ou abafadas no meio
    const first = frets.indexOf(lo), last = frets.lastIndexOf(lo);
    const barre = played.length && first === frets.findIndex(f => f >= 0) && last - first >= 2 &&
      frets.slice(first, last + 1).every(f => f >= lo);
    if (barre) {
      const y = Y(lo - base + .5);
      s += `<rect class="dot" x="${X(first) - 3.5}" y="${y - 3.5}" width="${X(last) - X(first) + 7}" height="7" rx="3.5"/>`;
    }
    frets.forEach((f, i) => {
      if (f < 0) s += `<path class="mk" d="M${X(i) - 2.5} 6.5l5 5m0-5l-5 5"/>`;
      else if (f === 0) s += `<circle class="mk" cx="${X(i)}" cy="9" r="2.6"/>`;
      else if (!(barre && f === lo)) s += `<circle class="dot" cx="${X(i)}" cy="${Y(f - base + .5)}" r="3.6"/>`;
    });
    return `<figure><figcaption>${esc(name)}</figcaption><svg viewBox="0 0 72 82" aria-hidden="true">${s}</svg></figure>`;
  }

  // ---------- Cifra ----------
  function renderSheet(text, shift, flats, used) {
    const ch = name => {
      const t = transpose(name, shift, flats);
      if (isChord(t) && !used.includes(t)) used.push(t);
      return `<b class="c">${esc(t)}</b>`;
    };
    return text.replace(/^\n+|\s+$/g, '').split('\n').map(line => {
      const trimmed = line.trim();
      if (!trimmed) return '<div class="gap"></div>';
      if (trimmed.startsWith('#')) return `<h3>${esc(trimmed.replace(/^#\s*/, ''))}</h3>`;
      if (/^[eBGDAE]\|/.test(trimmed)) return `<div class="tab">${esc(line)}</div>`;
      if (/\[[^\]]+\]/.test(line)) {
        // Cada acorde fica preso à primeira palavra seguinte; as demais palavras viram
        // blocos próprios para a linha poder quebrar entre palavras no celular
        const seg = (chord, text) => `<span class="seg"><i>${chord}</i><span>${esc(text) || ' '}</span></span>`;
        const words = text => text.match(/\S+\s*|\s+/g) || [];
        const parts = line.split(/\[([^\]]+)\]/);
        let html = words(parts[0]).map(w => seg('', w)).join('');
        for (let i = 1; i < parts.length; i += 2) {
          const [first = '', ...rest] = words(parts[i + 1]);
          html += seg(ch(parts[i]), first) + rest.map(w => seg('', w)).join('');
        }
        return `<div class="row">${html}</div>`;
      }
      const toks = trimmed.split(/\s+/);
      if (toks.every(t => isChord(t) || /^[|%x×\d().\-–]+$/.test(t)))
        return `<div class="cl">${toks.map(t => (isChord(t) ? ch(t) : `<span>${esc(t)}</span>`)).join('')}</div>`;
      return `<div class="ly">${esc(line)}</div>`;
    }).join('');
  }

  // ---------- Importar (texto copiado de um site de cifras → formato do musicas.js) ----------
  const TAB_RE = /^[eBGDAE]\|/;
  const isChordLine = s => {
    const toks = s.trim().split(/\s+/);
    return !!s.trim() && toks.some(isChord) && toks.every(t => isChord(t) || /^[|%x×\d().\-–]+$/.test(t));
  };
  const isLyric = s => !!s && !!s.trim() && !isChordLine(s) && !TAB_RE.test(s.trim()) && !/^\[[^\]]+\]/.test(s.trim());

  // Insere cada acorde da linha de cima na mesma coluna da letra: "C    G" + "Letra aqui" → "[C]Letr[G]a aqui"
  function mergeChords(chords, lyric) {
    let s = lyric;
    for (const m of [...chords.matchAll(/\S+/g)].reverse()) {
      if (s.length < m.index) s = s.padEnd(m.index);
      s = s.slice(0, m.index) + `[${m[0]}]` + s.slice(m.index);
    }
    return s;
  }

  function convert(raw) {
    const lines = raw.replace(/\r/g, '').replace(/\t/g, '    ').split('\n').map(l => l.replace(/\s+$/, ''));
    const out = [];
    let tom = '';
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i], t = line.trim();
      const tm = t.match(/^tom:\s*([A-G][#b]?m?)(?![\w#])/i);
      if (tm) { tom ||= tm[1]; continue; }
      const sec = t.match(/^\[([^\]]+)\]\s*(.*)$/);
      if (sec && !isChord(sec[1])) {
        out.push('# ' + sec[1].trim());
        if (sec[2]) out.push(sec[2]); // "[Intro] Em7 G ..."
      } else if (isChordLine(line)) {
        if (isLyric(lines[i + 1])) out.push(mergeChords(line, lines[++i]));
        else out.push(t.split(/\s+/).join('  '));
      } else {
        out.push(TAB_RE.test(t) ? t : line);
      }
    }
    return { text: out.join('\n').replace(/\n{3,}/g, '\n\n').trim(), tom };
  }

  const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const literal = s => s.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${');

  // Monta a música e o arquivo original (formato do musicas.js) a partir do texto copiado do site de cifras
  function buildSong({ titulo, artista, tom, fonte, texto }) {
    const { text, tom: detectado } = convert(texto);
    const song = { id: slug(titulo), titulo, artista, tom: tom || detectado || 'C' };
    // Mesmo título de outro artista: inclui o artista no id. Mesmo título e artista: é a mesma música.
    const same = MUSICAS.find(m => m.id === song.id);
    if (same && slug(same.artista) !== slug(artista)) song.id = slug(artista + ' ' + titulo);
    const original = `window.MUSICAS = [\n  {\n    id: ${JSON.stringify(song.id)},\n    titulo: ${JSON.stringify(titulo)},\n` +
      `    artista: ${JSON.stringify(artista)},\n    tom: ${JSON.stringify(song.tom)},\n` +
      (fonte ? `    fonte: ${JSON.stringify(fonte)},\n` : '') +
      `    cifra: \`\n${literal(text)}\n\`,\n  },\n];\n`;
    return {
      song: { ...song, ...(fonte ? { fonte } : {}), cifra: text },
      base: slug(artista + ' ' + titulo),
      original,
      detectado,
    };
  }

    $('iCopiar').addEventListener('click', async () => {

    $('iSalvar').addEventListener('click', async () => {

    $('iCripto').addEventListener('click', async () => {
      const msg = $('iCriptoMsg'), btn = $('iCripto');
      if (!crypto.subtle) { msg.textContent = 'Abra o site por https ou localhost'; return; }
      if (!built.song.cifra.trim()) { msg.textContent = 'Cole a cifra primeiro'; return; }
      if (!privKey && !$('iSenha').value) { msg.textContent = 'Digite a senha'; return; }
      btn.disabled = true;
      msg.textContent = 'Criptografando…';
      try {
        const r = await encryptAndSave({ ...built, original: $('iOriginal').checked ? built.original : null, senha: $('iSenha').value });
        $('iSenha').value = '';
        msg.innerHTML = (r.pasta ? `Salvo: ${esc(r.arquivos.map(f => 'musicas/' + f).join(', '))}. `
          : `Baixado. Mova cada arquivo para: ${esc(r.arquivos.map(f => 'musicas/' + f).join(', '))}. `) +
          `<a href="#${esc(built.song.id)}">Abrir a música</a>`;
      } catch (e) {

          : e.message === 'senha incorreta' ? 'Senha diferente da usada nas outras músicas' : e.message;

  // Crédito da cifra: "Fonte: dominio.com" com link para a página original
  function sourceHTML(url) {
    let u;
    try { u = new URL(url); } catch { return ''; }
    if (!/^https?:$/.test(u.protocol)) return '';
    const host = u.hostname.replace(/^www\./, '');

  }

  // ---------- Estado da música aberta ----------
  let current = null;
  let fs = store.get('fs', 17);
  let showChords = store.get('diagramas', true);
  let speed = store.get('velocidade', 2);
  const SPEEDS = [8, 14, 22, 32, 45, 62, 85]; // px/s
  let scrolling = false, lastT = 0, acc = 0;
  let ownTop = 0, touching = false, userAt = 0; // para não brigar com a rolagem feita pelo dedo

  function renderList() {
    const q = norm($('q').value.trim());
    const items = MUSICAS.filter(m => !q || norm(m.titulo + ' ' + m.artista).includes(q));
    $('count').textContent = `${items.length} ${items.length === 1 ? 'música' : 'músicas'}`;
    $('songs').innerHTML = items.length
      ? items.map(m => `<li><a href="#${esc(m.id)}"${current === m ? ' aria-current="true"' : ''}><b>${esc(m.titulo)}</b><span>${esc(m.artista)}${m.bloqueada ? ' · com senha' : m.privada ? ' · privada' : ''}</span></a></li>`).join('')
      : '<li class="none">Nenhuma música encontrada</li>';
  }

  function renderSong() {

    const flats = useFlats(key);
    const shownKey = transpose(current.tom, shift, flats);
    const used = [];
    const sheet = renderSheet(current.cifra, shift, flats, used);
    const label = shift ? ` (${shift > 0 ? '+' : ''}${shift})` : '';

    song.innerHTML = `
      <div class="song-head">
        <button class="back" data-act="back">← Músicas</button>

          ${shift ? '<button data-act="reset">Original</button>' : ''}
        </div>
        <div class="tool"><span>Texto</span>
          <button data-act="smaller" aria-label="Diminuir texto">A−</button>
          <button data-act="bigger" aria-label="Aumentar texto">A+</button>
        </div>

  }

  function open() {
    const id = decodeURIComponent(location.hash.slice(1));
    const prev = current;
    current = MUSICAS.find(m => m.id === id) || null;
    const importing = id === 'importar', batch = id === 'lote';
    $('app').classList.toggle('viewing', !!current || importing || batch);
    document.title = current ? `${current.titulo} · ${current.artista} — Cifras`
      : importing ? 'Importar cifra — Cifras' : batch ? 'Importar em lote — Cifras' : 'Cifras';
    renderList();
    // O importador não é redesenhado se já estiver aberto, para não perder o texto colado
    if (importing) { stopScroll(); if (!$('iTexto')) renderImporter(); }
    else if (batch) { stopScroll(); if ($('lFila')) paintBatch(); else renderBatch(); }
    else renderSong();
    if (current !== prev) $('song').scrollTop = 0;
  }

  // ---------- Rolagem automática ----------
  // Enquanto o dedo arrasta a cifra (ou a inércia do gesto continua), a rolagem automática
  // espera, sem desligar, e retoma de onde o usuário parou
  function tick(t) {
    if (!scrolling) return;
    const el = $('song');
    if (touching || t - userAt < 200) { lastT = t; acc = 0; return requestAnimationFrame(tick); }
    if (lastT) acc += SPEEDS[speed - 1] * (t - lastT) / 1000;
    lastT = t;
    const px = Math.floor(acc);
    if (px) { el.scrollTop += px; acc -= px; ownTop = el.scrollTop; }
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 1) return stopScroll();
    requestAnimationFrame(tick);
  }
  function startScroll() {
    scrolling = true; lastT = 0; acc = 0; ownTop = $('song').scrollTop;
    const b = $('scrollBtn'); if (b) { b.textContent = '❚❚'; b.setAttribute('aria-pressed', 'true'); }
    requestAnimationFrame(tick);
  }
  function stopScroll() {
    scrolling = false;
    const b = $('scrollBtn'); if (b) { b.textContent = '▶'; b.setAttribute('aria-pressed', 'false'); }
  }

  // ---------- Ações ----------
  const setFs = v => { fs = Math.max(13, Math.min(28, v)); store.set('fs', fs); document.documentElement.style.setProperty('--fs', fs + 'px'); };
  setFs(fs);

  $('song').addEventListener('click', e => {
    const btn = e.target.closest('[data-act], .key');
    if (btn?.dataset.act === 'back') { location.hash = ''; return; }
    if (!btn || !current) return;
    const act = btn.dataset.act || 'reset';
    const k = 'tom.' + current.id, shift = store.get(k, 0);
    const wrap = v => ((v + 17) % 12) - 5; // mantém entre -5 e +6
    if (act === 'up' || act === 'down' || act === 'reset') {
      store.set(k, act === 'reset' ? 0 : wrap(shift + (act === 'up' ? 1 : -1)));
      const top = $('song').scrollTop;
      renderSong();
      $('song').scrollTop = top;
    }
    else if (act === 'smaller') setFs(fs - 1);
    else if (act === 'bigger') setFs(fs + 1);
    else if (act === 'scroll') scrolling ? stopScroll() : startScroll();
    else if (act === 'slower' || act === 'faster') {
      speed = Math.max(1, Math.min(SPEEDS.length, speed + (act === 'faster' ? 1 : -1)));
      store.set('velocidade', speed);
      $('speed').textContent = speed;
    }
    else if (act === 'chords') {
      showChords = !showChords;
      store.set('diagramas', showChords);
      btn.setAttribute('aria-pressed', showChords);
      document.querySelector('.diagrams').hidden = !showChords;
    }
  });
  // Tocar na cifra (sem arrastar) pausa a rolagem; arrastar ou usar a roda do mouse só a adia
  $('song').addEventListener('click', e => { if (scrolling && !e.target.closest('.tools')) stopScroll(); });
  $('song').addEventListener('touchstart', () => { touching = true; }, { passive: true });
  addEventListener('touchend', () => { touching = false; userAt = performance.now(); });
  addEventListener('touchcancel', () => { touching = false; userAt = performance.now(); });
  $('song').addEventListener('scroll', e => {
    if (Math.abs(e.target.scrollTop - ownTop) > 1) { userAt = performance.now(); ownTop = e.target.scrollTop; }
  }, { passive: true });

  // ---------- Cifras privadas (criptografadas com senha) ----------
  // musicas/criptografadas/indice.js lista os arquivos .enc.js da mesma pasta, um por música, cifrados com
  // AES-GCM; a chave vem da senha via PBKDF2. Sem a senha certa a descriptografia falha.
  // A senha nunca é guardada; com "Lembrar neste aparelho", guarda-se só a chave
  // derivada, no navegador local. O importador criptografa novas músicas aqui mesmo,
  // no mesmo formato do criptografar.js.
  let CRIPTO = window.MUSICAS_CRIPTO || null;
  let privKey = null;   // chave em memória enquanto desbloqueado
  let privadas = [];    // músicas privadas já descriptografadas
  const ITERACOES = 600000;
  const GERADO = '// Gerado automaticamente (site de cifras ou criptografar.js); não edite à mão.\n';

  // Carrega os arquivos criptografados (com elementos script, que funcionam também abrindo o arquivo direto)
  let loading = null;
  // Entradas do índice: { arquivo, id, titulo, artista }. Índices antigos (v2) só têm o arquivo.
  const entradas = (ind = CRIPTO) => ind ? ind.musicas || ind.arquivos.map(arquivo => ({ arquivo })) : [];
  const loadEncrypted = () => loading ||= Promise.all(entradas().map(e => new Promise(done => {
    const s = document.createElement('script');
    s.src = 'musicas/criptografadas/' + e.arquivo;
    s.onload = s.onerror = done;
    document.head.appendChild(s);
  }))).then(() => window.MUSICAS_CRIPTO_DADOS ||= []);
  const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => {
    const b = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
    return btoa(s);
  };

  async function deriveKey(senha, salt, iter) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(salt), iterations: iter },
      base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  }
  const decryptOne = async (key, { iv, data }) => JSON.parse(new TextDecoder().decode(
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(iv) }, key, fromB64(data))));

  function applyPrivate() {
    if (privKey) {
      // Desbloqueado: a versão privada substitui a pública de mesmo id (ex.: com letra no lugar da só com acordes)
      const ids = new Set(privadas.map(m => m.id));
      MUSICAS = [...PUBLICAS.filter(m => !ids.has(m.id)), ...privadas].sort(byTitle);
    } else {
      // Bloqueado: todas aparecem na lista; as que não têm versão pública pedem a senha ao abrir
      const pub = new Set(PUBLICAS.map(m => m.id));
      const bloqueadas = entradas().filter(e => e.titulo && !pub.has(e.id))
        .map(e => ({ id: e.id, titulo: e.titulo, artista: e.artista, privada: true, bloqueada: true }));
      MUSICAS = [...PUBLICAS, ...bloqueadas].sort(byTitle);
    }
    renderLock();
    open();
  }
  async function unlockWith(key) {
    const results = await Promise.allSettled((await loadEncrypted()).map(d => decryptOne(key, d)));
    const ok = results.filter(r => r.status === 'fulfilled').map(r => r.value);
    if (results.length && !ok.length) throw new Error('senha incorreta');
    if (ok.length < results.length) console.warn(`${results.length - ok.length} cifra(s) privada(s) não abriram`);
    privKey = key;
    // Se a mesma música foi regravada, vale a versão mais recente
    privadas = [...new Map(ok.map(m => [m.id, { ...m, privada: true }])).values()];
    applyPrivate();
  }
  function lock() {
    store.set('chave', null);
    privKey = null;
    privadas = [];
    applyPrivate();
  }
  function renderLock() {
    $('lockBtn').hidden = !CRIPTO;
    $('lockBtn').textContent = privKey ? 'Bloquear' : 'Desbloquear';
    if (privKey) $('unlock').hidden = true;
    if ($('iSenha')) { $('iSenha').hidden = !!privKey; $('iSenhaInfo').hidden = !privKey; }
    // Índice antigo, sem os nomes: dá para completar depois de desbloquear
    $('idxNotice').hidden = !(privKey && entradas().some(e => !e.titulo));
  }

  // Índice com título e artista de cada arquivo. Os nomes vêm das músicas já abertas,
  // pelo nome do arquivo (artista-musica.enc.js, a mesma regra do criptografar.js).
  function indexWithNames(ind, novas = []) {
    const porArquivo = new Map(entradas(ind).map(e => [e.arquivo, e]));
    for (const m of privadas) {
      const arquivo = slug(`${m.artista} ${m.titulo}`) + '.enc.js';
      if (porArquivo.has(arquivo)) porArquivo.set(arquivo, { arquivo, id: m.id, titulo: m.titulo, artista: m.artista });
    }
    for (const e of novas) porArquivo.set(e.arquivo, e);
    const musicas = [...porArquivo.values()].sort((a, b) => a.arquivo.localeCompare(b.arquivo));
    return { v: 3, iter: ind.iter, salt: ind.salt, musicas };
  }

  // Pasta musicas/ do projeto (Chrome/Edge), com as subpastas criptografadas/ e originais/.
  // O seletor precisa vir logo após o clique.
  async function pickDir() {
    if (!window.showDirectoryPicker) return null;
    const dir = await showDirectoryPicker({ id: 'musicas', mode: 'readwrite' });
    if (dir.name !== 'musicas') throw new Error('Escolha a pasta "musicas" do projeto');
    return dir;
  }
  // Grava na pasta escolhida ("subpasta/arquivo"); sem ela (outros navegadores), baixa os arquivos
  async function writeFiles(dir, files) {
    for (const [name, text] of Object.entries(files)) {
      const [sub, file] = name.split('/');
      if (!dir) { download(file, text); continue; }
      const pasta = await dir.getDirectoryHandle(sub, { create: true });
      const w = await (await pasta.getFileHandle(file, { create: true })).createWritable();
      await w.write(text);
      await w.close();
    }
  }
  const indexFile = ind => GERADO + `window.MUSICAS_CRIPTO = ${JSON.stringify(ind, null, 2)};\n`;
  const parseIndex = text => { const w = {}; new Function('window', text)(w); return w.MUSICAS_CRIPTO || null; };

  // O navegador pode ter usado um indice.js antigo do cache. Antes de regravar o índice, junta as
  // músicas que já estão no da pasta, para nenhuma sumir da lista.
  async function mergeDiskIndex(dir, ind) {
    let text;
    try {
      const pasta = await dir.getDirectoryHandle('criptografadas');
      text = await (await (await pasta.getFileHandle('indice.js')).getFile()).text();
    } catch { return ind; } // ainda não existe
    const disco = parseIndex(text);
    if (!disco) return ind;
    if (disco.salt !== ind.salt) throw new Error('O índice da pasta usa outra senha. Recarregue a página (⌘⇧R) e tente de novo.');
    const arquivos = new Set(entradas(ind).map(e => e.arquivo));
    return { ...ind, musicas: [...entradas(ind), ...entradas(disco).filter(e => !arquivos.has(e.arquivo))] };
  }

  // O servidor local não diz ao navegador para não guardar o indice.js, e a lista ficaria sem as
  // músicas novas: relê o índice sem cache (só por http/https; abrindo o arquivo direto, vale o carregado)
  async function refreshIndex() {
    if (!/^https?:$/.test(location.protocol)) return;
    try {
      const r = await fetch('musicas/criptografadas/indice.js', { cache: 'no-cache' });
      const ind = r.ok && parseIndex(await r.text());
      if (!ind || JSON.stringify(ind) === JSON.stringify(CRIPTO)) return;
      CRIPTO = window.MUSICAS_CRIPTO = ind;
      loading = null; // carrega os .enc.js do índice novo
      if (privKey) await unlockWith(privKey); else applyPrivate();
    } catch {}
  }

  const download = (name, text) => {
    const a = Object.assign(document.createElement('a'),
      { href: URL.createObjectURL(new Blob([text], { type: 'text/javascript' })), download: name });
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  // Criptografa uma música e grava em musicas/criptografadas/ (e o original em musicas/originais/)
  // (Chrome/Edge); nos outros navegadores os arquivos vão para Downloads.
  // A importação em lote passa a pasta já escolhida (dir); sem ela, pede a pasta agora.
  async function encryptAndSave({ song, base, original, senha }, dir) {
    if (dir === undefined) dir = await pickDir();

    let key = privKey;
    let indice = CRIPTO;
    if (!key) {
      if (!senha) throw new Error('Digite a senha');
      indice ||= { v: 3, iter: ITERACOES, salt: toB64(crypto.getRandomValues(new Uint8Array(16))), musicas: [] };
      key = await deriveKey(senha, indice.salt, indice.iter);
      // Com músicas já criptografadas, a senha precisa ser a mesma delas
      if (CRIPTO) await unlockWith(key);
    }

    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(song)));
    const payload = { iv: toB64(iv), data: toB64(data) };
    const encName = base + '.enc.js';
    if (dir) indice = await mergeDiskIndex(dir, indice);
    indice = indexWithNames(indice, [{ arquivo: encName, id: song.id, titulo: song.titulo, artista: song.artista }]);

    const files = {
      ['criptografadas/' + encName]: GERADO + `(window.MUSICAS_CRIPTO_DADOS = window.MUSICAS_CRIPTO_DADOS || []).push(${JSON.stringify(payload)});\n`,
      'criptografadas/indice.js': indexFile(indice),
    };
    if (original) files['originais/' + base + '.js'] = original;
    await writeFiles(dir, files);

    // Atualiza a página sem precisar recarregar
    CRIPTO = window.MUSICAS_CRIPTO = indice;
    (await (loading ||= Promise.resolve(window.MUSICAS_CRIPTO_DADOS ||= []))).push(payload);
    privKey = key;
    privadas = [...privadas.filter(m => m.id !== song.id), { ...song, privada: true }];
    applyPrivate();
    return { pasta: !!dir, arquivos: Object.keys(files) };
  }

  $('lockBtn').addEventListener('click', () => {
    if (privKey) return lock();
    $('unlock').hidden = !$('unlock').hidden;
    if (!$('unlock').hidden) $('pw').focus();
  });
  async function submitUnlock(pw, remember, msg, btn) {
    if (!crypto.subtle) { msg.textContent = 'Abra o site por https ou localhost'; return; }
    btn.disabled = true;
    msg.textContent = 'Abrindo…';
    try {
      const key = await deriveKey(pw.value, CRIPTO.salt, CRIPTO.iter);
      await unlockWith(key);
      if (remember.checked)
        store.set('chave', { salt: CRIPTO.salt, key: toB64(await crypto.subtle.exportKey('raw', key)) });
      pw.value = '';
      msg.textContent = '';
    } catch {
      msg.textContent = 'Senha incorreta';
    } finally {
      btn.disabled = false;
    }
  }
  $('unlock').addEventListener('submit', e => {
    e.preventDefault();
    submitUnlock($('pw'), $('remember'), $('pwMsg'), $('pwBtn'));
  });
  $('song').addEventListener('submit', e => {
    if (e.target.id !== 'lockedForm') return;
    e.preventDefault();
    submitUnlock($('lpw'), $('lremember'), $('lMsg'), $('lBtn'));
  });

  $('idxBtn').addEventListener('click', async () => {
    const msg = $('idxMsg');
    try {
      const dir = await pickDir();
      const ind = indexWithNames(dir ? await mergeDiskIndex(dir, CRIPTO) : CRIPTO);
      await writeFiles(dir, { 'criptografadas/indice.js': indexFile(ind) });
      CRIPTO = window.MUSICAS_CRIPTO = ind;
      msg.textContent = dir ? '' : 'Mova o indice.js baixado para a pasta musicas/criptografadas/.';
      renderLock();
    } catch (e) {
      msg.textContent = e.name === 'AbortError' ? 'Cancelado' : e.message;
    }
  });

  // ---------- Importar em lote ----------
  // A fila vem de musicas/fila.js (título, artista e link; fica só no computador). A página da cifra
  // abre numa aba nossa; lá, o favorito "Pegar cifra" manda o texto de volta para cá, onde a música é
  // convertida, criptografada e gravada, e a aba segue para a próxima da fila.

  // Roda na página do site de cifras (vira o favorito): não pode usar nada de fora da função.
  // Sem comentários de linha dentro dela, por segurança, já que o código vira um link.
  // Lê o textContent, e não o innerText: o Cifra Club só desenha parte da cifra por vez, e o
  // innerText vinha cortado. O tom vem de "Tom: X"; com capotraste, vale o da forma dos acordes,
  // que é o dos acordes escritos. Se a aba não foi aberta pela fila, copia a cifra para colar aqui.
  function grabCifra() {
    const pres = [...document.querySelectorAll('.cifra_cnt pre')];
    const alvo = pres.length ? pres
      : [...document.querySelectorAll('pre')].sort((a, b) => b.querySelectorAll('b').length - a.querySelectorAll('b').length).slice(0, 1);
    const texto = alvo.map(p => {
      const c = p.cloneNode(true);
      c.querySelectorAll('button, svg, script, style, template, img').forEach(e => e.remove());
      return c.textContent;
    }).join('\n');
    if (!texto.trim()) return alert('Não achei a cifra nesta página.');
    const pagina = document.body.innerText;
    const antigo = ((document.querySelector('#cifra_tom') || {}).innerText || '').match(/[A-G][#b]?m?(?![\w#])/);
    const forma = pagina.match(/forma dos acordes no tom de\s*([A-G][#b]?m?)(?![\w#])/i);
    const rotulo = pagina.match(/\btom:\s*([A-G][#b]?m?)(?![\w#])/i);
    const tom = forma ? forma[1] : antigo ? antigo[0] : rotulo ? rotulo[1] : '';
    const dados = { tipo: 'cifra-lote', url: location.href, tom, texto };
    const aviso = t => {
      const d = document.createElement('div');
      d.textContent = t;
      d.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2147483647;padding:12px 20px;' +
        'border-radius:8px;background:#15171a;color:#f5a524;font:600 15px system-ui,sans-serif;box-shadow:0 4px 20px #0008';
      document.body.appendChild(d);
    };
    if (window.opener) { window.opener.postMessage(dados, '*'); aviso('Cifra enviada. Salvando…'); return; }
    navigator.clipboard.writeText(JSON.stringify(dados)).then(
      () => aviso('Cifra copiada. Volte à importação em lote e cole (⌘V / Ctrl+V).'),
      () => alert('Não consegui copiar a cifra.'));
  }
  const BOOKMARKLET = 'javascript:' + encodeURIComponent(`(${grabCifra})()`);

  const batch = { loaded: false, dir: null, senha: '', tab: null, at: -1, msg: '', chain: Promise.resolve(), redo: false, redone: new Set() };
  const queue = () => window.MUSICAS_FILA || [];
  const encFile = m => slug(`${m.artista} ${m.titulo}`) + '.enc.js';
  const savedEntry = m => entradas().find(e => e.arquivo === encFile(m));
  // Refazendo, contam como feitas só as salvas desde que a opção foi marcada
  const isDone = i => batch.redo ? batch.redone.has(i) : !!savedEntry(queue()[i]);
  // Próxima música ainda não feita depois da posição i (dando a volta na fila)
  const nextPending = (i = -1) => {
    const n = queue().length;
    for (let k = 1; k <= n; k++) { const j = (i + k + n) % n; if (!isDone(j)) return j; }
    return -1;
  };
  // Compara links sem www, barra final, parâmetros e âncora
  const samePage = (a, b) => {
    const key = u => { try { const x = new URL(u); return x.hostname.replace(/^www\./, '') + x.pathname.replace(/\/+$/, ''); } catch { return u; } };
    return key(a) === key(b);
  };

  function renderBatch() {
    $('song').innerHTML = `
      <div class="song-head">
        <button class="back" data-act="back">← Músicas</button>
        <h1>Importar em lote</h1>
        <p class="artist">Salva as músicas de <code>musicas/fila.js</code> uma por vez, criptografadas, sem copiar e colar.
          Funciona no Chrome ou no Edge, com o site aberto em <code>localhost</code>.</p>
      </div>
      <div class="imp">
        <ol class="passos">
          <li>Arraste <a class="fav" id="lFav" href="${esc(BOOKMARKLET)}">Pegar cifra</a> para a barra de favoritos (só na primeira vez).</li>
          <li>Digite a senha, clique em <b>Escolher pasta</b> e escolha a pasta <code>musicas/</code> do projeto.</li>
          <li>Clique em <b>Abrir próxima</b>. Na página da cifra, clique no favorito <b>Pegar cifra</b>:
            a música é salva aqui e a aba passa sozinha para a próxima da fila.</li>
        </ol>
        <div class="imp-enc">
          <div class="imp-enc-row">
            <input id="lSenha" type="password" placeholder="Senha das cifras privadas" autocomplete="current-password">
            <span id="lSenhaInfo" hidden>Usando a senha já desbloqueada</span>
            <button id="lPasta" type="button">Escolher pasta</button>
            <button id="lAbrir" type="button">Abrir próxima</button>
          </div>
          <label class="remember"><input type="checkbox" id="lRefazer"> Refazer também as já salvas (substitui a versão atual)</label>
          <span class="imp-msg" id="bMsg" role="status"></span>
        </div>
      </div>
      <div class="fila"><p class="fila-h" id="lConta"></p><ul id="lFila"></ul></div>`;

    $('lFav').addEventListener('click', e => {
      e.preventDefault();
      batchMsg('Não clique aqui: arraste o botão para a barra de favoritos e use-o na página da cifra.');
    });
    $('lPasta').addEventListener('click', async () => {
      if (!window.showDirectoryPicker) return batchMsg('Use o Chrome ou o Edge: a importação em lote grava direto na pasta.');
      if (!crypto.subtle) return batchMsg('Abra o site por localhost.');
      const senha = $('lSenha').value;
      if (!privKey && !senha) return batchMsg('Digite a senha.');
      try {
        const dir = await pickDir();
        if (!privKey) {
          batchMsg('Conferindo a senha…');
          // Com músicas já criptografadas, a senha precisa ser a mesma delas
          if (CRIPTO) await unlockWith(await deriveKey(senha, CRIPTO.salt, CRIPTO.iter));
          else batch.senha = senha;
        }
        batch.dir = dir;
        $('lSenha').value = '';
        batchMsg(nextPending() < 0 ? 'Todas as músicas da fila já estão salvas. Para refazer, marque a opção abaixo.' : 'Pronto. Clique em Abrir próxima.');
      } catch (e) {
        batchMsg(e.name === 'AbortError' ? 'Cancelado' : e.message === 'senha incorreta' ? 'Senha diferente da usada nas outras músicas' : e.message);
      }
      paintBatch();
    });
    $('lAbrir').addEventListener('click', () => openInTab(nextPending(batch.at)));
    $('lRefazer').addEventListener('change', e => {
      batch.redo = e.target.checked;
      batch.redone = new Set();
      batch.at = -1;
      paintBatch();
    });
    $('lFila').addEventListener('click', e => {
      const b = e.target.closest('button[data-i]');
      if (b) openInTab(+b.dataset.i);
    });

    if (batch.loaded) return paintBatch();
    paintBatch();
    const s = document.createElement('script');
    s.src = 'musicas/fila.js';
    s.onload = s.onerror = () => { batch.loaded = true; paintBatch(); };
    document.head.appendChild(s);
  }

  function batchMsg(t) {
    batch.msg = t;
    if ($('bMsg')) $('bMsg').textContent = t;
  }

  function paintBatch() {
    if (!$('lFila')) return;
    const q = queue(), ready = !!batch.dir;
    $('lSenha').hidden = !!privKey;
    $('lSenhaInfo').hidden = !privKey;
    $('lPasta').textContent = ready ? 'Pasta escolhida ✓' : 'Escolher pasta';
    $('lAbrir').disabled = !ready || nextPending(batch.at) < 0;
    $('bMsg').textContent = batch.msg;
    $('lRefazer').checked = batch.redo;
    if (!q.length) {
      $('lConta').innerHTML = !batch.loaded ? 'Carregando a fila…' : 'Não achei a fila. Crie <code>musicas/fila.js</code> com ' +
        '<code>window.MUSICAS_FILA = [{ titulo, artista, fonte }, …]</code>.';
      $('lFila').innerHTML = '';
      return;
    }
    $('lConta').textContent = batch.redo ? `${batch.redone.size} de ${q.length} refeitas` : `${q.filter(savedEntry).length} de ${q.length} salvas`;
    $('lFila').innerHTML = q.map((m, i) => {
      const e = savedEntry(m);
      return `<li${i === batch.at ? ' class="atual"' : ''}>
        <button type="button" data-i="${i}"${ready ? '' : ' disabled'}>${esc(m.titulo)}<span>${esc(m.artista)}</span></button>
        ${i === batch.at ? '<em>aberta na aba</em>' : e && isDone(i) ? `<a href="#${esc(e.id)}">✓ ${batch.redo ? 'refeita' : 'salva'}</a>` : e ? `<a href="#${esc(e.id)}">salva antes</a>` : ''}</li>`;
    }).join('');
  }

  // Abre a música i na aba da fila (a mesma aba é reaproveitada enquanto estiver aberta)
  function openInTab(i) {
    if (i < 0 || !queue()[i]) return;
    batch.at = i;
    const url = queue()[i].fonte;
    if (batch.tab && !batch.tab.closed) batch.tab.location.href = url;
    else batch.tab = window.open(url, 'cifra-lote');
    if (!batch.tab) batchMsg('O navegador bloqueou a aba. Clique em Abrir próxima.');
    paintBatch();
  }

  // Recebe a cifra mandada pelo favorito; fromTab = veio da aba da fila (e não colada)
  async function receiveCifra(d, fromTab) {
    if (!batch.dir) return batchMsg('Escolha a pasta antes de pegar as cifras.');
    const q = queue();
    let i = q.findIndex(m => samePage(m.fonte, d.url));
    if (i < 0 && fromTab) i = batch.at;
    if (i < 0) return batchMsg(`Essa página não está na fila: ${d.url}`);
    const m = q[i];
    const built = buildSong({ titulo: m.titulo, artista: m.artista, tom: d.tom, fonte: m.fonte, texto: d.texto });
    if (!built.song.cifra) return batchMsg(`Não achei a cifra de ${m.titulo} na página.`);
    batchMsg(`Salvando ${m.titulo}…`);
    try {
      await encryptAndSave({ ...built, senha: batch.senha }, batch.dir);
      if (batch.redo) batch.redone.add(i);
    } catch (e) {
      return batchMsg(`Erro ao salvar ${m.titulo}: ${e.message}`);
    }
    const next = nextPending(i);
    if (next < 0) {
      batch.at = -1;
      batchMsg(`Salva: ${m.titulo}. Todas as músicas da fila foram salvas: faça commit de musicas/criptografadas/.`);
      paintBatch();
      return;
    }
    openInTab(next);
    batchMsg(`Salva: ${m.titulo}. ` + (batch.tab ? `Abrindo ${q[next].titulo}…` : 'Clique em Abrir próxima.'));
  }

  window.addEventListener('message', e => {
    const d = e.data;
    if (!batch.tab || e.source !== batch.tab || d?.tipo !== 'cifra-lote' || typeof d.texto !== 'string') return;
    // Uma de cada vez: o índice é regravado a cada música
    batch.chain = batch.chain.then(() => receiveCifra(d, true));
  });
  // Plano B: quando a aba não consegue falar com esta página, o favorito copia a cifra para colar aqui
  document.addEventListener('paste', e => {
    if (!$('lFila')) return;
    let d;
    try { d = JSON.parse(e.clipboardData.getData('text')); } catch { return; }
    if (d?.tipo !== 'cifra-lote' || typeof d.texto !== 'string') return;
    e.preventDefault();
    batch.chain = batch.chain.then(() => receiveCifra(d, false));
  });

  // Chave lembrada: só vale enquanto o sal não mudar (o criptografar.js gera um sal novo)
  (async () => {
    await refreshIndex();
    const saved = CRIPTO && crypto.subtle && store.get('chave', null);
    if (!saved || saved.salt !== CRIPTO.salt) return;
    try {
      const key = await crypto.subtle.importKey('raw', fromB64(saved.key), 'AES-GCM', true, ['encrypt', 'decrypt']);
      await unlockWith(key);
    } catch { store.set('chave', null); }
  })();

  $('q').addEventListener('input', renderList);
  window.addEventListener('hashchange', open);
  applyPrivate();
})();
</script>
<script>
  // Guarda o site no aparelho para funcionar offline (ver sw.js)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
